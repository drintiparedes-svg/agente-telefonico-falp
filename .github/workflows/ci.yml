name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificación de tipos
        run: npm run typecheck
      - name: Pruebas
        # Incluye los seis escenarios de seguridad clínica, con umbral del 100 %.
        run: npm test
